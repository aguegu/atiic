  <text x="363" y="1000" font-size="12" fill="#374151">ground</text>
  <rect x="427" y="987" width="18" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="451" y="1000" font-size="12" fill="#374151">unused in that mode</text>
  <text x="40" y="1036" font-size="14" font-weight="bold" fill="#222">The jumpers: set them unplugged, the chip reads them at power-up</text>
  <text x="40" y="1060" font-size="12" fill="#374151"><tspan font-weight="bold">Yellow on I2C:</tspan> 1a86:5512, EPP/MEM and I2C: atiic's mode (lsusb: "CH341 in EPP/MEM/I2C mode")</text>
  <text x="40" y="1080" font-size="12" fill="#374151"><tspan font-weight="bold">Yellow on TTL:</tspan> USB to UART on TXD/RXD (ttyUSB); atiic can't open it</text>
  <text x="40" y="1100" font-size="12" fill="#374151"><tspan font-weight="bold">Green on 3V3:</tspan> VCC and the chip at 3.3 V: SDA, SCL swing to 3.3 V (for 3.3 V parts: the MPU-6050)</text>
  <text x="40" y="1120" font-size="12" fill="#374151"><tspan font-weight="bold">Green on 5V:</tspan> VCC and the chip at 5 V: SDA, SCL pulled up to 5 V</text>
  <text x="40" y="1164" font-size="12" fill="#374151">• The mode, per the datasheet (§5.3): the chip reads its SDA pin at reset, low for 5512 (I2C), open for a serial port. How the jumper does it isn't traced.</text>
  <text x="40" y="1184" font-size="12" fill="#374151">• I2C at 20, 100, 400 or 750 kHz. Only the address's ack comes back: a missing device throws, a refused data byte doesn't (docs/ch341.md).</text>
  <text x="40" y="1204" font-size="12" fill="#374151">• SDA and SCL have weak pull-ups inside (100-500 uA, the datasheet): a module's own pull-ups (the GY-521 has them) set the edges.</text>
  <text x="40" y="1224" font-size="12" fill="#374151">• No SPI and no D0-D7 on the CH341T (SSOP-20): for SPI, the displays and pins(), the CH341A (docs/setup.md) or the CH347.</text>
  <text x="40" y="1244" font-size="12" fill="#374151">• TXD and RXD stay free in I2C mode. The LEDs are named after the serial mode's status pins RDY# and TNOW (17, 18); not traced.</text>
  <text x="40" y="1278" font-size="10" fill="#6b7280">Chip pins: WCH CH341DS1, the CH341C/T (SSOP-20) column (§4.2, §4.3, §5.3). The board as docs/setup.svg draws it; its traces not followed. atiic docs/ch341.md, docs/setup.md.</text>
  <text x="1160" y="1302" text-anchor="end" font-size="10" fill="#6b7280">atiic · github.com/aguegu/atiic · MIT · © 2026 Weihong Guan (aGuegu), drawn with Claude</text>
