  <text x="600.0" y="1022.39" text-anchor="middle" font-size="19.0" font-weight="bold" fill="#6b7178">USB-A</text>
  <rect x="40" y="1176.0" width="18" height="18" rx="9" fill="#dcfce7" stroke="#4fb879"/>
  <text x="64" y="1189.0" font-size="12" fill="#374151">I2C</text>
  <rect x="107" y="1176.0" width="18" height="18" rx="9" fill="#ccfbf1" stroke="#2f9e8f"/>
  <text x="131" y="1189.0" font-size="12" fill="#374151">I/O</text>
  <rect x="174" y="1176.0" width="18" height="18" rx="9" fill="#fde2e2" stroke="#d97b7b"/>
  <text x="198" y="1189.0" font-size="12" fill="#374151">power</text>
  <rect x="255" y="1176.0" width="18" height="18" rx="9" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="279" y="1189.0" font-size="12" fill="#374151">ground</text>
  <text x="40" y="1225.0" font-size="14" font-weight="bold" fill="#222">The jumpers: set them unplugged, the chip reads them at power-up</text>
  <text x="40" y="1249.0" font-size="12" fill="#374151"><tspan font-weight="bold">Yellow on I2C:</tspan> 1a86:5512, EPP/MEM and I2C: atiic's mode (lsusb: "CH341 in EPP/MEM/I2C mode")</text>
  <text x="40" y="1269.0" font-size="12" fill="#374151"><tspan font-weight="bold">Green on 3V3:</tspan> VCC and the chip at 3.3 V: SDA, SCL swing to 3.3 V (for 3.3 V parts: the MPU-6050)</text>
  <text x="40" y="1289.0" font-size="12" fill="#374151"><tspan font-weight="bold">Green on 5V:</tspan> VCC and the chip at 5 V: SDA, SCL pulled up to 5 V</text>
  <text x="40" y="1333.0" font-size="12" fill="#374151">• The mode, per the datasheet (§5.3): the chip reads its SDA pin at reset, low for 5512 (I2C). How the jumper does it isn't traced.</text>
  <text x="40" y="1353.0" font-size="12" fill="#374151">• I2C at 20, 100, 400 or 750 kHz. Only the address's ack comes back: a missing device throws, a refused data byte doesn't (docs/ch341.md).</text>
  <text x="40" y="1373.0" font-size="12" fill="#374151">• SDA and SCL have weak pull-ups inside (100-500 uA, the datasheet): a module's own pull-ups set the edges.</text>
  <text x="40" y="1393.0" font-size="12" fill="#374151">• No SPI and no D0-D7 on the CH341T (SSOP-20): for SPI, the displays and pins(), the CH341A (docs/setup.md) or the CH347.</text>
  <text x="40" y="1413.0" font-size="12" fill="#374151">• TXD and RXD in I2C mode: digital I/O, pulled up as inputs, driven high or low as outputs, usable beside the I2C bus.</text>
  <text x="40" y="1433.0" font-size="12" fill="#374151">• WCH's status read (0xA0) and output command (0xA1) name them ERR# and PEMP, as on the CH341A; the datasheet gives them no job in this mode (measured).</text>
  <text x="40" y="1453.0" font-size="12" fill="#374151">• The LEDs are named after the serial mode's status pins, RDY# and TNOW; not traced.</text>
  <text x="40" y="1487.0" font-size="10" fill="#6b7280">Board and parts from the vendor's photo (YouXin; 35 x 18 mm); chip pins: WCH CH341DS1, the CH341C/T (SSOP-20) column (§4.2, §4.3, §5.3); TXD, RXD as I/O measured. atiic docs/ch341.md, docs/setup.md.</text>
