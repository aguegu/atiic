  <title>CH341T "2-in-1" dongle (USB to I2C / TTL)</title>
  <rect width="1200" height="1731" fill="#ffffff"/>
  <text x="600.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">CH341T "2-in-1" dongle (USB to I2C / TTL)</text>
  <text x="600.0" y="62" text-anchor="middle" font-size="13" fill="#555">Top view, USB-A down, to scale (the board 18 x 35 mm). The 6-pin header, the chip pin behind each, each pin in I2C mode (atiic's) and TTL mode.</text>
