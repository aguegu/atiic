  <text x="678" y="324" font-size="11.5" fill="#1f2937">VCC: 3.3 V or 5 V, the green jumper</text>
  <rect x="926" y="308" width="172" height="24" rx="12" fill="#fde2e2" stroke="#d97b7b"/>
  <text x="938" y="324" font-size="11.5" fill="#1f2937">the same</text>
  <text x="1110" y="324" font-size="12" font-weight="bold" fill="#1f2937">VCC</text>
  <text x="40" y="416" font-size="14" font-weight="bold" fill="#222">The jumpers: set them unplugged, the chip reads them at power-up</text>
  <rect x="32" y="427" width="1116" height="21" rx="4" fill="#dcfce7"/>
  <text x="40" y="442" font-size="12" font-weight="bold" fill="#1f2937">Yellow, I2C</text>
  <text x="150" y="442" font-size="12" fill="#1f2937">1a86:5512</text>
  <text x="260" y="442" font-size="12" fill="#1f2937">EPP/MEM and I2C: atiic's mode (lsusb: "CH341 in EPP/MEM/I2C mode")</text>
  <text x="40" y="464" font-size="12" font-weight="bold" fill="#1f2937">Yellow, TTL</text>
  <text x="150" y="464" font-size="12" fill="#1f2937">a serial port</text>
  <text x="260" y="464" font-size="12" fill="#1f2937">USB to UART on TXD/RXD (ttyUSB); atiic can't open it</text>
  <rect x="32" y="471" width="1116" height="21" rx="4" fill="#dcfce7"/>
  <text x="40" y="486" font-size="12" font-weight="bold" fill="#1f2937">Green, 3V3</text>
  <text x="150" y="486" font-size="12" fill="#1f2937"></text>
  <text x="260" y="486" font-size="12" fill="#1f2937">VCC and the chip at 3.3 V: SDA, SCL swing to 3.3 V (for 3.3 V parts: the MPU-6050)</text>
  <text x="40" y="508" font-size="12" font-weight="bold" fill="#1f2937">Green, 5V</text>
  <text x="150" y="508" font-size="12" fill="#1f2937"></text>
  <text x="260" y="508" font-size="12" fill="#1f2937">VCC and the chip at 5 V: SDA, SCL pulled up to 5 V</text>
  <text x="40" y="554" font-size="12" fill="#374151">• The mode, per the datasheet (§5.3): the chip reads its SDA pin at reset, low for 5512 (I2C), open for a serial port. How the jumper does it isn't traced.</text>
  <text x="40" y="574" font-size="12" fill="#374151">• I2C at 20, 100, 400 or 750 kHz. Only the address's ack comes back: a missing device throws, a refused data byte doesn't (docs/ch341.md).</text>
  <text x="40" y="594" font-size="12" fill="#374151">• SDA and SCL have weak pull-ups inside (100-500 uA, the datasheet): a module's own pull-ups (the GY-521 has them) set the edges.</text>
  <text x="40" y="614" font-size="12" fill="#374151">• No SPI and no D0-D7 on the CH341T (SSOP-20): for SPI, the displays and pins(), the CH341A (docs/setup.md) or the CH347.</text>
  <text x="40" y="634" font-size="12" fill="#374151">• TXD and RXD stay free in I2C mode. The LEDs are named after the serial mode's status pins RDY# and TNOW (17, 18); not traced.</text>
  <text x="40" y="672" font-size="10" fill="#6b7280">Chip pins: WCH CH341DS1, the CH341C/T (SSOP-20) column (§4.2, §4.3, §5.3). The board as docs/setup.svg draws it; its traces not followed. atiic docs/ch341.md, docs/setup.md.</text>
  <text x="1140" y="698" text-anchor="end" font-size="10" fill="#6b7280">atiic · github.com/aguegu/atiic · MIT · © 2026 Weihong Guan (aGuegu), drawn with Claude</text>
