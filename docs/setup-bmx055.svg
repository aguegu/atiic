<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Helvetica, Arial, sans-serif">
  <title>atiic bench: a CH341A (V357) dongle in I2C mode at 3.3V, wired to a BMX055 module (CJMCU-900F) with PS on CS0 (D0)</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ecef"/>
      <stop offset="0.5" stop-color="#b8bec5"/>
      <stop offset="1" stop-color="#d9dde1"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3d77a"/>
      <stop offset="1" stop-color="#b8922a"/>
    </linearGradient>
    <g id="dupont">
      <rect x="-6" y="-6" width="12" height="12" rx="1.5" fill="#1b1b1b"/>
      <rect x="-2" y="-2" width="4" height="4" fill="#444"/>
    </g>
  </defs>

  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">CH341A (V357, I2C/SPI mode, 3.3V) + BMX055 module</text>

  <!-- the BMX055 module, a CJMCU-900F: its ten pins top to bottom -->
  <rect x="40" y="118" width="150" height="290" rx="8" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <rect x="78" y="242" width="44" height="34" rx="2" fill="#1d1d1d"/>
  <text x="100" y="293" text-anchor="middle" font-size="9" fill="#fff">BMX055</text>
  <text x="100" y="140" text-anchor="middle" font-size="10" fill="#fff">CJMCU-900F</text>
  <rect x="172" y="136" width="18" height="254" fill="#161616"/>
  <g fill="url(#pin)">
    <rect x="181" y="148" width="34" height="4"/>
    <rect x="181" y="173" width="34" height="4"/>
    <rect x="181" y="198" width="34" height="4"/>
    <rect x="181" y="223" width="34" height="4"/>
    <rect x="181" y="248" width="34" height="4"/>
    <rect x="181" y="273" width="34" height="4"/>
    <rect x="181" y="298" width="34" height="4"/>
    <rect x="181" y="323" width="34" height="4"/>
    <rect x="181" y="348" width="34" height="4"/>
    <rect x="181" y="373" width="34" height="4"/>
  </g>
  <g font-size="11" fill="#fff" text-anchor="end" font-family="Menlo, Consolas, monospace">
    <text x="166" y="154">3V3</text>
    <text x="166" y="179">GND</text>
    <text x="166" y="204">SCL</text>
    <text x="166" y="229">SDA</text>
    <text x="166" y="254">PS</text>
    <text x="166" y="279">SDO1</text>
    <text x="166" y="304">SDO2</text>
    <text x="166" y="329">CSB1</text>
    <text x="166" y="354">CSB2</text>
    <text x="166" y="379">CSB3</text>
  </g>
  <text x="115" y="428" text-anchor="middle" font-size="12" fill="#555">BMX055 module (CJMCU-900F)</text>

  <!-- the CH341A V357: header on the left, USB-A on the right -->
  <rect x="290" y="120" width="470" height="240" rx="6" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <rect x="760" y="190" width="110" height="100" rx="3" fill="url(#metal)" stroke="#8a9096"/>
  <rect x="790" y="212" width="20" height="14" fill="#6b7178"/>
  <rect x="790" y="254" width="20" height="14" fill="#6b7178"/>
  <text x="815" y="180" text-anchor="middle" font-size="12" fill="#555">to the PC</text>

  <!-- the 2x8 header: outer column (x 330) and inner column (x 356), rows y 150..325 -->
  <rect x="320" y="138" width="48" height="200" fill="#161616"/>
  <g fill="url(#pin)">
    <circle cx="331" cy="150" r="4"/><circle cx="331" cy="175" r="4"/><circle cx="331" cy="200" r="4"/><circle cx="331" cy="225" r="4"/>
    <circle cx="331" cy="250" r="4"/><circle cx="331" cy="275" r="4"/><circle cx="331" cy="300" r="4"/><circle cx="331" cy="325" r="4"/>
    <circle cx="357" cy="150" r="4"/><circle cx="357" cy="175" r="4"/><circle cx="357" cy="200" r="4"/><circle cx="357" cy="225" r="4"/>
    <circle cx="357" cy="250" r="4"/><circle cx="357" cy="275" r="4"/><circle cx="357" cy="300" r="4"/><circle cx="357" cy="325" r="4"/>
  </g>
  <!-- the parallel port's two rows of 10 holes, top and bottom edges: unused here -->
  <g fill="#0f2c50" stroke="#c9ccd1" stroke-width="1.5">
    <circle cx="470" cy="136" r="5"/><circle cx="495" cy="136" r="5"/><circle cx="520" cy="136" r="5"/><circle cx="545" cy="136" r="5"/><circle cx="570" cy="136" r="5"/>
    <circle cx="595" cy="136" r="5"/><circle cx="620" cy="136" r="5"/><circle cx="645" cy="136" r="5"/><circle cx="670" cy="136" r="5"/><circle cx="695" cy="136" r="5"/>
    <circle cx="470" cy="344" r="5"/><circle cx="495" cy="344" r="5"/><circle cx="520" cy="344" r="5"/><circle cx="545" cy="344" r="5"/><circle cx="570" cy="344" r="5"/>
    <circle cx="595" cy="344" r="5"/><circle cx="620" cy="344" r="5"/><circle cx="645" cy="344" r="5"/><circle cx="670" cy="344" r="5"/><circle cx="695" cy="344" r="5"/>
  </g>

  <!-- crystal, chip -->
  <rect x="450" y="165" width="90" height="30" rx="14" fill="url(#metal)" stroke="#8a9096"/>
  <text x="495" y="184" text-anchor="middle" font-size="9" fill="#555">12.0M</text>
  <rect x="440" y="225" width="170" height="64" rx="2" fill="#1d1d1d"/>
  <text x="525" y="262" text-anchor="middle" font-size="13" fill="#ccc">CH341A</text>

  <!-- the voltage pair, top right: both jumpers on 3V3 (5V the board's default) -->
  <text x="704" y="160" text-anchor="end" font-size="9" fill="#fff">3V3</text>
  <text x="704" y="205" text-anchor="end" font-size="9" fill="#fff">5V</text>
  <g fill="#111">
    <rect x="708" y="152" width="14" height="14"/><rect x="708" y="170" width="14" height="14"/><rect x="708" y="188" width="14" height="14"/>
    <rect x="730" y="152" width="14" height="14"/><rect x="730" y="170" width="14" height="14"/><rect x="730" y="188" width="14" height="14"/>
  </g>
  <circle cx="715" cy="195" r="3" fill="url(#pin)"/><circle cx="737" cy="195" r="3" fill="url(#pin)"/>
  <rect x="705" y="149" width="20" height="38" rx="3" fill="#2a2a2a" stroke="#000"/>
  <rect x="727" y="149" width="20" height="38" rx="3" fill="#2a2a2a" stroke="#000"/>

  <!-- the mode jumper, bottom right: on I2C/SPI (UART the other way) -->
  <text x="704" y="300" text-anchor="end" font-size="9" fill="#fff">I2C/SPI</text>
  <text x="704" y="336" text-anchor="end" font-size="9" fill="#fff">UART</text>
  <g fill="#111"><rect x="708" y="291" width="14" height="14"/><rect x="708" y="309" width="14" height="14"/><rect x="708" y="327" width="14" height="14"/></g>
  <circle cx="715" cy="334" r="3" fill="url(#pin)"/>
  <rect x="705" y="288" width="20" height="38" rx="3" fill="#2a2a2a" stroke="#000"/>

  <!-- the wires: the module's 3V3, GND, SCL, SDA to the dongle's VCC, GND, SCL, SDA (outer rows 4-7, the same order); PS under the board to CS0 -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M221 150 C 276 150, 276 225, 331 225" stroke="#8e1c1c" stroke-width="7"/><path d="M221 150 C 276 150, 276 225, 331 225" stroke="#d32f2f" stroke-width="5"/>
    <path d="M221 175 C 276 175, 276 250, 331 250" stroke="#000" stroke-width="7"/><path d="M221 175 C 276 175, 276 250, 331 250" stroke="#3a3a3a" stroke-width="5"/>
    <path d="M221 200 C 276 200, 276 275, 331 275" stroke="#a88600" stroke-width="7"/><path d="M221 200 C 276 200, 276 275, 331 275" stroke="#f2c200" stroke-width="5"/>
    <path d="M221 225 C 276 225, 276 300, 331 300" stroke="#0d4f8c" stroke-width="7"/><path d="M221 225 C 276 225, 276 300, 331 300" stroke="#1e88e5" stroke-width="5"/>
    <path d="M221 250 H 236 Q 250 250 250 264 V 436 Q 250 450 264 450 H 330 Q 344 450 344 436 V 289 Q 344 275 357 275" stroke="#4a1f6b" stroke-width="7"/><path d="M221 250 H 236 Q 250 250 250 264 V 436 Q 250 450 264 450 H 330 Q 344 450 344 436 V 289 Q 344 275 357 275" stroke="#8e44ad" stroke-width="5"/>
  </g>
  <!-- silkscreen, drawn over the wires on the board's blue: the outer column's labels left of it, the inner's right -->
  <g font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">
    <g text-anchor="end">
      <text x="316" y="153">GND</text><text x="316" y="178">RXD</text><text x="316" y="203">TXD</text><text x="316" y="228">VCC</text>
      <text x="316" y="253">GND</text><text x="316" y="278">SCL</text><text x="316" y="303">SDA</text><text x="316" y="328">VCC</text>
    </g>
    <g>
      <text x="374" y="153">MISO</text><text x="374" y="178">MOSI</text><text x="374" y="203">SCK</text><text x="374" y="228">CS2 (D2)</text>
      <text x="374" y="253">CS1 (D1)</text><text x="374" y="278">CS0 (D0)</text><text x="374" y="303">GND</text><text x="374" y="328">VCC</text>
    </g>
  </g>

  <use href="#dupont" x="331" y="250"/><use href="#dupont" x="331" y="275"/><use href="#dupont" x="331" y="300"/><use href="#dupont" x="331" y="325"/><use href="#dupont" x="357" y="275"/>

  <use href="#dupont" x="221" y="150"/><use href="#dupont" x="221" y="175"/><use href="#dupont" x="221" y="200"/><use href="#dupont" x="221" y="225"/><use href="#dupont" x="221" y="250"/>
  <use href="#dupont" x="331" y="225"/><use href="#dupont" x="331" y="250"/><use href="#dupont" x="331" y="275"/><use href="#dupont" x="331" y="300"/><use href="#dupont" x="357" y="275"/>

  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="20" y="490">Jumpers set unplugged: the pair top right on 3V3 (5V is the board's default), the one bottom right on I2C/SPI.</text>
    <text x="20" y="510">Five wires: VCC (3.3V) to 3V3, GND, SCL, SDA to the module's, and CS0 (the chip's D0) to PS: atiic drives it high (BENCH_PS=D0).</text>
    <text x="20" y="530">Never drive PS low while the BMX055 runs: its accelerometer stays on SPI until the module is powered off and on.</text>
  </g>
</svg>
