  <text x="40" y="658" font-size="14" font-weight="bold" fill="#222">Wiring an SPI display (an ST7735's pins)</text>
  <text x="40" y="682" font-size="12" fill="#374151"><tspan font-weight="bold">SCK</tspan> → pin 6 SCK</text>
  <text x="272" y="682" font-size="12" fill="#374151"><tspan font-weight="bold">SDA (MOSI)</tspan> → pin 8 MOSI</text>
  <text x="504" y="682" font-size="12" fill="#374151"><tspan font-weight="bold">CS</tspan> → pin 5 · CS0</text>
  <text x="736" y="682" font-size="12" fill="#374151"><tspan font-weight="bold">DC</tspan> → pin 2 · GPIO6</text>
  <text x="40" y="706" font-size="12" fill="#374151"><tspan font-weight="bold">RES</tspan> → pin 15 · GPIO4</text>
  <text x="272" y="706" font-size="12" fill="#374151"><tspan font-weight="bold">VCC, BL</tspan> → 3.3 V</text>
  <text x="504" y="706" font-size="12" fill="#374151"><tspan font-weight="bold">GND</tspan> → GND</text>
