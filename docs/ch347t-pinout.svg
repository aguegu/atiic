  <path d="M565 655 L572 662 L565 669 L558 662 Z" fill="#f59e0b" stroke="#92400e"/>
  <text x="578" y="666" font-size="12" fill="#374151">mode strap, read at reset</text>
  <text x="748" y="666" font-size="9" font-weight="bold" fill="#b45309">5V</text>
  <text x="764" y="666" font-size="12" fill="#374151">input tolerates 5 V</text>
  <text x="40" y="698" font-size="12" fill="#374151">• Mode 1 at reset: pin 10 (DTR1) open or high, pin 13 (RTS1) low; both are pulled up inside.</text>
  <text x="40" y="718" font-size="12" fill="#374151">• A GPIO is free only while its pin's function is unused: I2C takes GPIO3 (SCL); SPI takes GPIO0-2, and GPIO5 with SCS1.</text>
  <text x="40" y="738" font-size="12" fill="#374151">• With I2C and SPI (one chip select) running, GPIO4 (ACT), GPIO5 (SCS1), GPIO6 (CTS1) and GPIO7 (RTS1, its mode pull-down) are left.</text>
  <text x="40" y="758" font-size="12" fill="#374151">• The GPIO numbers: the datasheet names them only in mode 0's table; WCH's EVT gives the same pins and calls each GPIO</text>
  <text x="40" y="778" font-size="12" fill="#374151">  a function reuse pin, enabled separately. Not yet tried on atiic's CH347T: its GPIO commands aren't known yet.</text>
  <text x="40" y="816" font-size="10" fill="#6b7280">Sources: WCH CH347DS1 V1.6 §4.3 (tables 4-8 to 4-11), §5.2; CH347EVT_EN.pdf §3.2 and CH347SCH.pdf (the EVT). atiic docs/ch347.md.</text>
</svg>
