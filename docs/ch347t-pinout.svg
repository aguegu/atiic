  <path d="M607 743 L614 750 L607 757 L600 750 Z" fill="#f59e0b" stroke="#92400e"/>
  <text x="620" y="754" font-size="12" fill="#374151">mode strap</text>
  <text x="710" y="754" font-size="9" font-weight="bold" fill="#b45309">5V</text>
  <text x="726" y="754" font-size="12" fill="#374151">input tolerates 5 V</text>
  <text x="40" y="786" font-size="12" fill="#374151">• Mode 1 at reset: pin 10 (DTR1) open or high, pin 13 (RTS1) low; both are pulled up inside.</text>
  <text x="40" y="806" font-size="12" fill="#374151">• Only three GPIOs in mode 1: WCH's Linux driver offers GPIO4, GPIO6, GPIO7 on the CH347T (the CH347F has eight).</text>
  <text x="40" y="826" font-size="12" fill="#374151">• GPIO7 is the mode strap: usable once reset is over if the strap is a pull-down, not a short to GND.</text>
  <text x="40" y="846" font-size="12" fill="#374151">• GPIO4 is ACT: low once USB is up, so a RES on it resets the panel then; the driver resets it again at init.</text>
  <text x="40" y="866" font-size="12" fill="#374151">• GPIO6 shares pin 2 with UART1's CTS: no hardware flow control on UART1 while it's a GPIO.</text>
  <text x="40" y="904" font-size="10" fill="#6b7280">Sources: WCH CH347DS1 V1.6 §4.3 (tables 4-8, 4-9, 4-11), §5.2; WCH ch34x_mphsi_master_linux (ch347t_board_config, the 0xCC and 0xC1 commands); flashrom ch347_spi.c.</text>
